# Optional production-like local stack: PostgreSQL + S3-compatible MinIO (console http://localhost:9001)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: portfolio }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set l http://minio:9000 minioadmin minioadmin; mc mb -p l/resumes; exit 0"
volumes: { pgdata: {}, miniodata: {} }
